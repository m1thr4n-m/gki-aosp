name: Build Capybara NetHunter GKI

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/71chjzkc/gki-aosp
          kernel-branch: main
          config: capybara_defconfig
          arch: arm64
          android-version: 12
          aosp-clang: true
          aosp-clang-version: r510928
          aosp-gcc: true
          nethunter: true
          nethunter-patch: false
          anykernel3: true
          ksu: false
          ccache: true
          extra-make-args: '["LLVM=1", "LLVM_IAS=1"]'
