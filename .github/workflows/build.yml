name: Build Capybara NetHunter GKI

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/71chjzkc/gki-aosp
          kernel-branch: main
          config: capybara_defconfig
          arch: arm64
          android-version: 15
          aosp-clang: false
          aosp-gcc: false
          custom-clang: https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz
          nethunter: true
          nethunter-patch: true
          anykernel3: true
          ksu: false
          ccache: true
